services:
  web:
    build: .
    container_name: myweb
    ports:
      - "8080:80"
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: mydb
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: devopsdb
      MYSQL_USER: devops
      MYSQL_PASSWORD: devopspass
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
