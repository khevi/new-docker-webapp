<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kossi DevOps World</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      font-family: Arial, sans-serif;
      background:
        linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.7)),
        url('https://images.unsplash.com/photo-1506744038136-46273834b3fb');
      background-size: cover;
      background-position: center;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .container {
      text-align: center;
      background: rgba(255,255,255,0.08);
      padding: 60px;
      border-radius: 25px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.2);
      box-shadow: 0 0 30px rgba(0,255,170,0.4);
      animation: float 4s ease-in-out infinite;
    }

    h1 {
      font-size: 70px;
      color: #ffffff;
      margin-bottom: 20px;
      text-shadow: 0 0 20px #00ffae;
    }

    p {
      font-size: 24px;
      color: #d4fff1;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      padding: 15px 35px;
      background: #00ffae;
      color: #000;
      font-size: 20px;
      text-decoration: none;
      border-radius: 50px;
      transition: 0.3s;
      font-weight: bold;
    }

    .btn:hover {
      background: #ffffff;
      transform: scale(1.08);
      box-shadow: 0 0 20px #00ffae;
    }

    @keyframes float {
      0% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-10px);
      }
      100% {
        transform: translateY(0px);
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>I Love Nature big Time!!! 🌿</h1>
    <p>Kossi DevOps CI/CD Pipeline</p>

    <a class="btn" href="#">
      Explore Nature
    </a>
  </div>

</body>
</html>
