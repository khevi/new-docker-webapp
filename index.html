<!DOCTYPE html>
<html>
<head>
  <title>Kossi DevOps Lab</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background:
        linear-gradient(rgba(0, 80, 0, 0.45), rgba(0, 0, 0, 0.65)),
        url("https://upload.wikimedia.org/wikipedia/commons/2/24/United_States_one_dollar_bill%2C_obverse.jpg");
      background-size: cover;
      background-position: center;
      color: white;
      text-align: center;
    }

    .box {
      background: rgba(0, 0, 0, 0.65);
      padding: 50px;
      border-radius: 20px;
      border: 3px solid #3cff00;
      box-shadow: 0 0 30px #3cff00;
    }

    h1 {
      font-size: 70px;
      margin: 0;
      text-shadow: 0 0 15px #3cff00;
    }

    p {
      font-size: 24px;
      color: #b6ff9c;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>I love Adiglo Rosavi</h1>
    <p>Money is useful, but nature is priceless.</p>
  </div>
</body>
</html>
